<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Login | House Manager</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">

    <nav class="nav-container">

        <a href="/" class="logo">
            House Manager
        </a>

        <div class="nav-links">

            <a href="/" class="back-link">
                Back to Home
            </a>

        </div>

    </nav>

</header>


<main class="main-content auth-page">

    <h1>Manager Access</h1>

    <section class="card auth-card">

        <h2>Sign In</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="form-message-stack">
                    {% for category, message in messages %}
                        <div class="form-message {% if category == 'error' %}form-error{% else %}form-success{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/login" method="post" class="auth-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="auth-actions">
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Sign In
                </button>
            </div>

        </form>

        <div class="auth-links">

            <p>
                Don't have an account?
                <a href="/register" class="table-link">
                    Create one
                </a>
            </p>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-content">
        <p>&copy; 2026 House Manager</p>
    </div>

</footer>

</body>
</html>
