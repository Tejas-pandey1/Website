<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viewer | House Manager</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">

    <nav class="nav-container">

        <a href="/" class="logo">
            House Manager
        </a>

        <div class="nav-links">

            <span>
                Viewer: {{ viewer.viewer_id }}
            </span>

            <a href="/" class="back-link">
                Logout
            </a>

        </div>

    </nav>

</header>


<main class="main-content">

    <h1>Your Data</h1>


    <section class="card">

        <h2>{{ table.name }}</h2>

        <p style="color: #667085; margin-bottom: 1.5rem;">
            You have access to view this specific row of data.
        </p>


        <div style="overflow-x: auto;">

            <table class="data-table">

                <thead>

                    <tr>
                        <th>Field</th>
                        <th>Value</th>
                    </tr>

                </thead>


                <tbody>

                    {% for column in columns %}

                    <tr>

                        <td>
                            <strong>
                                {{ column.name }}
                            </strong>
                        </td>

                        <td>
                            {{ cell_values.get(row.id, {}).get(column.id, {}).value or '' }}
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-content">
        <p>&copy; 2026 House Manager</p>
    </div>

</footer>

</body>
</html>
