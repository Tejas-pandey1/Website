<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | House Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <nav class="nav-container">
        <a href="/" class="logo">House Manager</a>
        <div class="nav-links">
            <a href="/" class="back-link">Home</a>
            <a href="/login" class="back-link">Login</a>
        </div>
    </nav>
</header>

<main class="main-content">
    <h1>Create Account</h1>

    <section class="card" style="max-width: 420px; margin: 0 auto;">
        <h2>Register</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="form-message-stack" aria-live="polite">
                    {% for category, message in messages %}
                        <div class="form-message {% if category == 'error' %}form-error{% else %}form-success{% endif %}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/register" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Choose a password" required>
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%;">Create Account</button>
        </form>

        <div class="mt-3 text-center">
            <p>Already have an account? <a href="/login" class="table-link">Sign in</a></p>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2026 House Manager</p>
    </div>
</footer>

</body>
</html>
